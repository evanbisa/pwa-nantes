# Vérifications contre le vrai projet Supabase (depuis Internet, comme un visiteur) :
# sécurité des données en accès anonyme, fonction verify-siret, répertoire Sirene ;
# et règles de sécurité de la base (scénarios RLS) sur une base jetable reconstruite par les migrations.
name: Vérifier Supabase en ligne

on:
  push:
    branches: [claude/street-food-map-pwa-lr1xu2]
    paths: ['web/supabase/**', 'web/scripts/**', 'index.html', 'vercel.json', 'scripts/**', .github/workflows/verifications.yml]
  schedule:
    - cron: '17 6 * * 1'   # chaque lundi matin : garde aussi le projet Supabase actif (pause après 7 jours d'inactivité)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fnypgfyxbyaqrnklhjxc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_W-2Gra6O-pRBEf0a_XsyKw_8UlhHTzb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Ce qu'un visiteur anonyme peut lire (RLS)
        working-directory: web
        run: node scripts/check-supabase.mjs

      - name: Sites en ligne (aucune clé secrète, politique CSP, en-têtes de sécurité)
        working-directory: web
        run: node scripts/check-live.mjs

      - name: Tests de la fonction verify-siret (sans réseau)
        working-directory: web
        run: deno test supabase/functions/

      - name: Fonction en ligne et répertoire Sirene réel
        working-directory: web
        run: deno run --allow-net --allow-env supabase/tests/smoke.ts

  # Règles de sécurité de la base (RLS, droits, fonctions, rôle de sauvegarde) : toutes les migrations appliquées sur une
  # base jetable PostgreSQL 17 (même version que Supabase), puis plus de 300 scénarios (visiteur, client, restaurateur…)
  regles-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Client PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Scénarios de sécurité de la base
        run: sh web/supabase/tests/rls/run.sh
