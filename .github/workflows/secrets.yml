# Contrôle des secrets à chaque modification : aucun fichier du dépôt ne doit contenir de clé secrète,
# de mot de passe ou de clé privée (voir scripts/check-secrets.mjs). Échoue, et le signale, si c'est le cas.
name: Contrôle des secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Aucun secret dans le dépôt
        run: node scripts/check-secrets.mjs
