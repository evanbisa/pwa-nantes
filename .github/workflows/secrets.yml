# Contrôle des secrets à chaque modification : aucun fichier du dépôt ne doit contenir de clé secrète,
# de mot de passe ou de clé privée (voir scripts/check-secrets.mjs). Échoue, et le signale, si c'est le cas.
name: Contrôle des secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Aucun secret dans le dépôt
        run: node scripts/check-secrets.mjs
