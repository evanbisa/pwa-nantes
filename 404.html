<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <title>Page introuvable · FlashMiam</title>
  <!-- Page des adresses inconnues. /pwa-nantes/ : chemin du site (« / » sur Vercel, « /pwa-nantes/ » sur GitHub Pages),
       remplacé à la publication par scripts/seo.mjs -->
  <link rel="icon" href="/pwa-nantes/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg: #f8fafc; --text: #0f172a; --muted: #475569; --card: #fff; --line: #e2e8f0; --accent: #1a73e8; --on-accent: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111113; --text: #fafafa; --muted: #a1a1aa; --card: rgb(255 255 255 / .05); --line: rgb(255 255 255 / .1); --accent: #a78bfa; --on-accent: #111113; }
      body { background: radial-gradient(38rem 26rem at 50% 10%, rgb(124 58 237 / .14), transparent 70%) no-repeat fixed, var(--bg); }
      em { background: linear-gradient(90deg, #e9a0e4, #a78bfa 55%, #7f95fb); -webkit-background-clip: text; background-clip: text; color: transparent; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); background-color: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { width: 100%; max-width: 420px; }
    .logo { width: 72px; height: 72px; margin: 0 auto; }
    .code { margin: 28px 0 0; font-size: 14px; font-weight: 600; letter-spacing: .12em; color: var(--muted); }
    h1 { margin: 8px 0 0; font-size: 30px; line-height: 1.15; letter-spacing: -.02em; }
    em { font-style: normal; color: var(--accent); }
    p { margin: 14px 0 0; color: var(--muted); }
    .go { display: flex; align-items: center; justify-content: center; min-height: 54px; margin-top: 32px; border-radius: 999px; font-weight: 600; text-decoration: none; color: var(--on-accent); background: var(--accent); }
    .go:focus-visible, .alt:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .alt { display: inline-block; margin-top: 18px; color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 512 512" role="img" aria-label="FlashMiam"><rect width="512" height="512" rx="112" fill="#fff" stroke="#e2e8f0" stroke-width="8"/><path d="M256 96c-66 0-120 54-120 120 0 90 120 200 120 200s120-110 120-200c0-66-54-120-120-120z" fill="#ea4335"/><circle cx="256" cy="216" r="44" fill="#fff"/></svg>
    <p class="code">ERREUR 404</p>
    <h1>Cette page n'est <em>pas sur la carte</em></h1>
    <p>Le lien est peut-être ancien ou mal recopié. Les bons plans, eux, vous attendent toujours.</p>
    <a class="go" href="/pwa-nantes/">Retour à la carte</a>
    <a class="alt" href="/pwa-nantes/app/inscription/">Pas encore de compte ? Créer un compte</a>
  </main>
</body>
</html>
